<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean &amp; Byte Café | Order</title>
</head>
<body>
  <!-- Same header as index.html (done for you) -->
  <header>
    <img src="images/logo.svg" alt="Bean &amp; Byte Café logo" width="80" height="80">
    <h1>Bean &amp; Byte Café</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="order.html">Order</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Order Ahead</h2>
    <p>Fill in the form and your order will be ready when you arrive.</p>

    <!--
      action = where the data is sent. method = how it is sent.
      method="get" puts the data in the address bar, so we can SEE what the form sends.
      In Class 5 we change this to action="place-order.php" method="post".
    -->
    <form action="order.html" method="get">

      <fieldset>
        <legend>Your details</legend>

        <!-- Example (done for you). Notice:
             - for="name" on the label matches id="name" on the input. Click the label to try it!
             - name="name" is the name the data is sent with
             - required means the form cannot be sent while this is empty -->
        <p>
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Nur Aisyah" required>
        </p>

        <!-- TODO 1: Email field. Label "Email", type="email", id and name "email", required -->
          <p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="e.g. aisyah@example.com" required>
          </p>



        <!-- TODO 2: Phone field. Label "Phone", type="tel", id and name "phone" (not required) -->
         <p>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. 012-345 6789">
          </p>

      </fieldset>

      <!-- TODO 3: Add a new <fieldset> with the <legend> "Your order". Inside it:

           3a. A dropdown: <select> with id and name "item", required.
               First option: <option value="">-- Choose an item --</option>
               Then <optgroup label="Drinks"> with Espresso, Latte, Matcha Latte
               and  <optgroup label="Food">   with Croissant, Blueberry Muffin, Chocolate Cake
               Each option looks like: <option value="latte">Latte</option>
               

           3b. Quantity: type="number", id and name "quantity", min="1", max="10", value="1"

           3c. Size: 3 radio buttons that all share name="size":
               Small, Regular (add checked to make it the default), Large
               Example:
                 <input type="radio" id="size-small" name="size" value="small">
                 <label for="size-small">Small</label>

           3d. Extras: 3 checkboxes, all with name="extras":
               Extra shot, Oat milk, Whipped cream -->
               <fieldset>
                <legend>Your order</legend>

                <p>
                  <label for="item">Item</label>
                  <select id="item" name="item" required>
                    <option value="">-- Choose an item --</option>
                    <optgroup label="Drinks">
                      <option value="espresso">Espresso</option>
                      <option value="latte">Latte</option>
                      <option value="matcha-latte">Matcha Latte</option>
                    </optgroup>
                    <optgroup label="Food">
                      <option value="croissant">Croissant</option>
                      <option value="blueberry-muffin">Blueberry Muffin</option>
                      <option value="chocolate-cake">Chocolate Cake</option>
                    </optgroup>
                  </select>
                </p>

                <p>
                  <label for="quantity">Quantity</label>
                  <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
                </p>

                <p>Size:</p>
                <input type="radio" id="size-small" name="size" value="small">
                <label for="size-small">Small</label><br>

                <input type="radio" id="size-regular" name="size" value="regular" checked>
                <label for="size-regular">Regular</label><br>

                <input type="radio" id="size-large" name="size" value="large">
                <label for="size-large">Large</label><br>

                <p>Extras:</p>
                <input type="checkbox" id="extra-shot" name="extras" value="extra-shot">
                <label for="extra-shot">Extra shot</label><br>

                <input type="checkbox" id="oat-milk" name="extras" value="oat-milk">
                <label for="oat-milk">Oat milk</label><br>

                <input type="checkbox" id="whipped-cream" name="extras" value="whipped-cream">
                <label for="whipped-cream">Whipped cream</label><br>


      <!-- TODO 4: Add a new <fieldset> with the <legend> "Pickup". Inside it:
           - 2 radio buttons with name="pickup_type": Dine in (checked) and Takeaway
           - Date: type="date", id and name "pickup_date"
           - Time: type="time", id and name "pickup_time", min="08:00", max="20:00" -->
           <fieldset>
            <legend>Pickup</legend>

            <input type="radio" id="dine-in" name="pickup_type" value="dine-in" checked>
            <label for="dine-in">Dine in</label><br>

            <input type="radio" id="takeaway" name="pickup_type" value="takeaway">
            <label for="takeaway">Takeaway</label><br>

            <p>
              <label for="pickup_date">Date</label>
              <input type="date" id="pickup_date" name="pickup_date">
            </p>

            <p>
              <label for="pickup_time">Time</label>
              <input type="time" id="pickup_time" name="pickup_time" min="08:00" max="20:00">
            </p>
           </fieldset>


      <!-- TODO 5: Add a new <fieldset> with the <legend> "Anything else?". Inside it:
           - A <textarea> with id and name "notes", rows="4", cols="40",
             placeholder="e.g. less sugar, nut allergy"
           - A required checkbox: id and name "agree", value="yes", with the label
             "I understand payment is made at the counter." -->
            <fieldset>
              <legend>Anything else?</legend>

              <p>
                <label for="notes">Notes</label><br>
                <textarea id="notes" name="notes" rows="4" cols="40" placeholder="e.g. less sugar, nut allergy"></textarea>
              </p>

              <input type="checkbox" id="agree" name="agree" value="yes" required>
              <label for="agree">I understand payment is made at the counter.</label><br>


      <!-- TODO 6: Add two buttons:
           <button type="submit">Place order</button>
           and a reset button with the text "Clear form" -->
           <button type="submit">Place order</button>
           <button type="reset">Clear form</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Bean &amp; Byte Café · <a href="mailto:hello@beanandbyte.example">hello@beanandbyte.example</a></p>
  </footer>
</body>
</html>
